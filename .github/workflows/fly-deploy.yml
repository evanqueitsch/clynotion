name: Fly Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-clynotion
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Read self-test delivery status only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set +e
          B64=$(python3 - <<'PY'
          import base64
          script = r'''
          import json, os, sys
          os.chdir("/app")
          sys.path.insert(0, "/app")
          from pathlib import Path
          # The ssh shell does not receive Fly secrets. Copy the running
          # server's environment in memory and never print it.
          for proc in Path("/proc").iterdir():
              if not proc.name.isdigit():
                  continue
              try:
                  cmd = (proc / "cmdline").read_bytes().replace(b"\x00", b" ").decode(errors="replace")
              except OSError:
                  continue
              if "uvicorn" not in cmd:
                  continue
              for item in (proc / "environ").read_bytes().split(b"\x00"):
                  if b"=" not in item:
                      continue
                  key, value = item.split(b"=", 1)
                  os.environ[key.decode(errors="replace")] = value.decode(errors="replace")
              break
          import base64
          from app.crypto import decrypt_utf8
          from app.google_oauth import default_practice_id
          from app.hr.gmail_oauth import connect_status
          path = os.environ.get("ATTUNE_HR_TIME_DATA_PATH", "")
          out = {"key_set": bool(os.environ.get("ATTUNE_DATA_ENCRYPTION_KEY")), "path_set": bool(path)}
          try:
              wrapper = json.loads(Path(path).read_text(encoding="utf-8"))
              blob = base64.b64decode(str(wrapper.get("blob") or ""))
              data = json.loads(decrypt_utf8(blob))
              rows = []
              for item in data.get("self_tests") or []:
                  kinds = {}
                  for kind, slot in (item.get("sends") or {}).items():
                      if isinstance(slot, dict):
                          kinds[str(kind)] = {
                              "status": slot.get("status") or "",
                              "last_error": slot.get("last_error") or "",
                              "at": slot.get("sent_at") or slot.get("at") or "",
                          }
                  rows.append({"kinds": kinds})
              out["self_test_count"] = len(rows)
              out["rows"] = rows
          except Exception as exc:
              out["decrypt"] = type(exc).__name__
          try:
              status = connect_status(default_practice_id())
              out["mailbox_connected"] = bool(status.get("connected"))
              out["sender_email"] = status.get("sender_email") or ""
              out["refresh_saved"] = bool(status.get("refresh_saved"))
              out["mailbox_error"] = status.get("last_error") or ""
              out["scheduled_mail"] = status.get("scheduled_mail") or ""
          except Exception as exc:
              out["mailbox"] = type(exc).__name__
          # Empty body cannot be a message. A 400 means the API accepted the
          # call and rejected the payload. A 403 is the same rejection the
          # sends hit, with its reason code and no delivery.
          try:
              import re
              import httpx
              from app.hr.gmail_oauth import GMAIL_SEND_URL, _refresh_gmail_access
              from app.workspace_directory import gmail_send_record
              record = gmail_send_record(default_practice_id())
              access = _refresh_gmail_access(record.get("refresh_token") or "")
              resp = httpx.post(GMAIL_SEND_URL, json={}, headers={"Authorization": "Bearer " + access}, timeout=20.0)
              body = resp.json() if "json" in resp.headers.get("content-type", "") else {}
              err = body.get("error") if isinstance(body, dict) else {}
              reasons = []
              if isinstance(err, dict):
                  if err.get("status"):
                      reasons.append(str(err.get("status"))[:80])
                  for item in (err.get("errors") or []) + (err.get("details") or []):
                      if isinstance(item, dict) and item.get("reason"):
                          reasons.append(str(item.get("reason"))[:80])
                  message = str(err.get("message") or "")
                  project = re.search(r"project(?:s)?(?:=|/)(\d{6,})", message)
                  if project:
                      out["gmail_project_number"] = project.group(1)
              out["probe_http"] = resp.status_code
              out["probe_reasons"] = reasons[:6]
          except Exception as exc:
              out["probe"] = type(exc).__name__
          print(json.dumps(out))
          '''
          print(base64.b64encode(script.encode()).decode())
          PY
          )
          timeout 45 flyctl ssh console -a clynotion -C "python -c \"import base64; exec(base64.b64decode('${B64}'))\"" < /dev/null
          exit 0

      - name: Ensure attune_data volume in iad
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          vols="$(flyctl volumes list -a clynotion --json)"
          # flyctl JSON uses lowercase name/region. Matching only .Name made this
          # count 0 and create another volume on every deploy.
          count="$(echo "$vols" | jq '[.[] | select((.name // .Name)=="attune_data" and ((.region // .Region)=="iad"))] | length')"
          echo "Existing attune_data volumes in iad: $count"
          echo "$vols" | jq -r '.[] | select((.name // .Name)=="attune_data") | "volume \(.id // .ID) region=\(.region // .Region) attached=\(.attached_machine_id // .attached_alloc_id // "none")"'
          if [ "$count" -lt 1 ]; then
            flyctl volumes create attune_data --region iad --size 1 -a clynotion -y
          fi
          # Volume apps should not run two machines on one volume.
          flyctl scale count 1 -a clynotion -y || true

      - name: Deploy
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
