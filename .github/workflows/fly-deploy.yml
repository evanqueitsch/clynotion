name: Fly Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-clynotion
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure attune_data volume in iad
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          vols="$(flyctl volumes list -a clynotion --json)"
          # flyctl JSON uses lowercase name/region. Matching only .Name made this
          # count 0 and create another volume on every deploy.
          count="$(echo "$vols" | jq '[.[] | select((.name // .Name)=="attune_data" and ((.region // .Region)=="iad"))] | length')"
          echo "Existing attune_data volumes in iad: $count"
          echo "$vols" | jq -r '.[] | select((.name // .Name)=="attune_data") | "volume \(.id // .ID) region=\(.region // .Region) attached=\(.attached_machine_id // .attached_alloc_id // "none")"'
          if [ "$count" -lt 1 ]; then
            flyctl volumes create attune_data --region iad --size 1 -a clynotion -y
          fi
          # Volume apps should not run two machines on one volume.
          flyctl scale count 1 -a clynotion -y || true

      - name: Deploy
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Read-only volume inventory
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          b64="$(base64 -w0 scripts/inventory_readonly.py)"
          flyctl ssh console -a clynotion -C "/app/.venv/bin/python -c \"import os,sys,base64; os.chdir('/app'); sys.path.insert(0,'/app'); exec(base64.b64decode('${b64}'))\""
