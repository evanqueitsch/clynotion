name: Fly Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-clynotion
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Rearm the pre-send summary claim
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          B64=$(python3 - <<'PY'
          import base64
          script = r'''
          import base64, json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          os.chdir("/app")
          sys.path.insert(0, "/app")
          for proc in Path("/proc").iterdir():
              if not proc.name.isdigit():
                  continue
              try:
                  cmd = (proc / "cmdline").read_bytes().replace(b"\x00", b" ").decode(errors="replace")
              except OSError:
                  continue
              if "uvicorn" not in cmd:
                  continue
              for item in (proc / "environ").read_bytes().split(b"\x00"):
                  if b"=" not in item:
                      continue
                  key, value = item.split(b"=", 1)
                  os.environ[key.decode(errors="replace")] = value.decode(errors="replace")
              break
          import fcntl
          from app.crypto import decrypt_utf8, encrypt_utf8
          from app.hr.time_entry import _atomic_write
          path = Path(os.environ["ATTUNE_HR_TIME_DATA_PATH"])
          lock = open(path.with_name(path.name + ".lock"), "a+")
          fcntl.flock(lock.fileno(), fcntl.LOCK_EX)
          try:
              wrapper = json.loads(path.read_text(encoding="utf-8"))
              data = json.loads(decrypt_utf8(base64.b64decode(str(wrapper.get("blob") or ""))))
              matches = []
              for item in data.get("self_tests") or []:
                  sends = item.get("sends") or {}
                  summary = sends.get("summary") if isinstance(sends, dict) else None
                  if not isinstance(summary, dict):
                      continue
                  at = str(summary.get("at") or summary.get("sent_at") or "")
                  if at.startswith("2026-11-06T21:34:03"):
                      matches.append(item)
              if len(matches) != 1:
                  print(json.dumps({"ok": False, "reason": "match_count", "count": len(matches)}))
                  sys.exit(1)
              item = matches[0]
              sends = item["sends"]
              summary = sends["summary"]
              thursday = sends.get("thursday") or {}
              friday = sends.get("friday") or {}
              def sent_ok(slot, expected):
                  return (
                      isinstance(slot, dict)
                      and slot.get("status") == "sent"
                      and slot.get("gmail_message_id") == expected
                  )
              if not sent_ok(thursday, "1a1b2c7bb84380e8") or not sent_ok(friday, "1a1b2c81cb100836"):
                  print(json.dumps({"ok": False, "reason": "accepted_sends_changed"}))
                  sys.exit(1)
              message_id = str(summary.get("gmail_message_id") or "")
              status = str(summary.get("status") or "")
              if message_id or status == "sent":
                  print(json.dumps({"ok": False, "reason": "summary_already_sent", "changed": False}))
                  sys.exit(1)
              history = list(summary.get("history") or [])
              already = any(isinstance(row, dict) and row.get("event") == "owner_authorized_rearm" for row in history)
              if status == "failed" and summary.get("last_error") == "gmail_mime_failed" and already:
                  print(json.dumps({"ok": True, "changed": False, "summary_status": "failed", "summary_error": "gmail_mime_failed", "summary_has_id": False, "thursday": "sent", "friday": "sent"}))
                  sys.exit(0)
              if not (status == "uncertain" and summary.get("last_error") == "gmail_uncertain"):
                  print(json.dumps({"ok": False, "reason": "not_the_pre_send_claim", "status": status}))
                  sys.exit(1)
              prior_at = str(summary.get("at") or "")
              history.append({
                  "event": "owner_authorized_rearm",
                  "reason": "pre_send_mime_typeerror",
                  "authorized_by": "evan",
                  "at": datetime.now(timezone.utc).isoformat(),
                  "prior_status": "uncertain",
                  "prior_error": "gmail_uncertain",
                  "prior_at": prior_at,
              })
              summary["history"] = history
              summary["status"] = "failed"
              summary["last_error"] = "gmail_mime_failed"
              summary["claim_token"] = ""
              blob = encrypt_utf8(json.dumps(data, separators=(",", ":")))
              _atomic_write(path, json.dumps({"version": 1, "blob": base64.b64encode(blob).decode("ascii")}, separators=(",", ":")))
              checked = json.loads(decrypt_utf8(base64.b64decode(json.loads(path.read_text(encoding="utf-8"))["blob"])))
              found = None
              for row in checked.get("self_tests") or []:
                  slot = ((row.get("sends") or {}).get("summary") or {})
                  if str(slot.get("at") or "").startswith("2026-11-06T21:34:03") or any(
                      isinstance(h, dict) and h.get("prior_at", "").startswith("2026-11-06T21:34:03")
                      for h in (slot.get("history") or [])
                  ):
                      found = row
                      break
              slot = (found or {}).get("sends", {}).get("summary", {})
              thu = (found or {}).get("sends", {}).get("thursday", {})
              fri = (found or {}).get("sends", {}).get("friday", {})
              ok = (
                  slot.get("status") == "failed"
                  and slot.get("last_error") == "gmail_mime_failed"
                  and not slot.get("gmail_message_id")
                  and thu.get("status") == "sent"
                  and thu.get("gmail_message_id") == "1a1b2c7bb84380e8"
                  and fri.get("status") == "sent"
                  and fri.get("gmail_message_id") == "1a1b2c81cb100836"
              )
              print(json.dumps({
                  "ok": ok,
                  "changed": True,
                  "summary_status": slot.get("status"),
                  "summary_error": slot.get("last_error"),
                  "summary_has_id": bool(slot.get("gmail_message_id")),
                  "thursday": thu.get("status"),
                  "friday": fri.get("status"),
                  "recovery": "owner_authorized_rearm",
              }))
              sys.exit(0 if ok else 1)
          finally:
              fcntl.flock(lock.fileno(), fcntl.LOCK_UN)
              lock.close()
          '''
          print(base64.b64encode(script.encode()).decode())
          PY
          )
          timeout 50 flyctl ssh console -a clynotion -C "python -c \"import base64; exec(base64.b64decode('${B64}'))\"" < /dev/null

      - name: Ensure attune_data volume in iad
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          vols="$(flyctl volumes list -a clynotion --json)"
          # flyctl JSON uses lowercase name/region. Matching only .Name made this
          # count 0 and create another volume on every deploy.
          count="$(echo "$vols" | jq '[.[] | select((.name // .Name)=="attune_data" and ((.region // .Region)=="iad"))] | length')"
          echo "Existing attune_data volumes in iad: $count"
          echo "$vols" | jq -r '.[] | select((.name // .Name)=="attune_data") | "volume \(.id // .ID) region=\(.region // .Region) attached=\(.attached_machine_id // .attached_alloc_id // "none")"'
          if [ "$count" -lt 1 ]; then
            flyctl volumes create attune_data --region iad --size 1 -a clynotion -y
          fi
          # Volume apps should not run two machines on one volume.
          flyctl scale count 1 -a clynotion -y || true

      - name: Deploy
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
