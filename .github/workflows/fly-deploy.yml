name: Fly Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-clynotion
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure attune_data volume in iad
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          vols="$(flyctl volumes list -a clynotion --json)"
          count="$(echo "$vols" | jq '[.[] | select(.Name=="attune_data" and .Region=="iad")] | length')"
          echo "Existing attune_data volumes in iad: $count"
          if [ "$count" -lt 1 ]; then
            flyctl volumes create attune_data --region iad --size 1 -a clynotion -y
          fi
          # Volume apps should not run two machines on one volume.
          flyctl scale count 1 -a clynotion -y || true

      - name: Deploy
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
