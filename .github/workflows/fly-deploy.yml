name: Fly Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-clynotion
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure attune_data volume in iad
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          vols="$(flyctl volumes list -a clynotion --json)"
          # flyctl JSON uses lowercase name/region. Matching only .Name made this
          # count 0 and create another volume on every deploy.
          count="$(echo "$vols" | jq '[.[] | select((.name // .Name)=="attune_data" and ((.region // .Region)=="iad"))] | length')"
          echo "Existing attune_data volumes in iad: $count"
          echo "$vols" | jq -r '.[] | select((.name // .Name)=="attune_data") | "volume \(.id // .ID) region=\(.region // .Region) attached=\(.attached_machine_id // .attached_alloc_id // "none")"'
          if [ "$count" -lt 1 ]; then
            flyctl volumes create attune_data --region iad --size 1 -a clynotion -y
          fi
          # Volume apps should not run two machines on one volume.
          flyctl scale count 1 -a clynotion -y || true

      - name: Set SAM_API_KEY on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SAM_API_KEY}" ]; then
            echo "SAM_API_KEY is empty in GitHub Actions"
            exit 1
          fi
          echo "Setting SAM_API_KEY on clynotion. The value is not printed."
          printf '%s\n' "SAM_API_KEY=${SAM_API_KEY}" | flyctl secrets import -a clynotion
          flyctl secrets list -a clynotion --json | python3 -c 'import json,sys; rows=json.load(sys.stdin); names=[str(item.get("name") or item.get("Name") or "") for item in rows]; print("SAM_API_KEY", "present" if "SAM_API_KEY" in names else "missing"); raise SystemExit(0 if "SAM_API_KEY" in names else 1)'

      - name: Deploy
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify Practice Owner
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          b64="$(base64 -w0 scripts/verify_practice_owner.py)"
          ok=0
          for _ in 1 2 3 4 5 6; do
            if flyctl ssh console -a clynotion -C "/app/.venv/bin/python -c \"import os,sys,base64; os.chdir('/app'); sys.path.insert(0,'/app'); exec(base64.b64decode('${b64}'))\""; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
          curl -fsS https://clynotion.com/health
          echo
          python3 - <<'PY'
          import json, urllib.request
          body = json.load(urllib.request.urlopen("https://clynotion.com/health", timeout=20))
          if body.get("version") != "0.30.5":
              raise SystemExit(f"public version is {body.get('version')}")
          if body.get("sam") != "configured":
              raise SystemExit(f"sam status is {body.get('sam')}")
          if body.get("exclusion_schedule") != "off" or body.get("audit_drive") != "not_configured":
              raise SystemExit("schedule or drive copy is not in the safe off state")
          print("public version", body["version"], "sam", body["sam"])
          PY
