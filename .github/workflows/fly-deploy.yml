name: Fly Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-clynotion
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure attune_data volume in iad
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          vols="$(flyctl volumes list -a clynotion --json)"
          # flyctl JSON uses lowercase name/region. Matching only .Name made this
          # count 0 and create another volume on every deploy.
          count="$(echo "$vols" | jq '[.[] | select((.name // .Name)=="attune_data" and ((.region // .Region)=="iad"))] | length')"
          echo "Existing attune_data volumes in iad: $count"
          echo "$vols" | jq -r '.[] | select((.name // .Name)=="attune_data") | "volume \(.id // .ID) region=\(.region // .Region) attached=\(.attached_machine_id // .attached_alloc_id // "none")"'
          if [ "$count" -lt 1 ]; then
            flyctl volumes create attune_data --region iad --size 1 -a clynotion -y
          fi
          # Volume apps should not run two machines on one volume.
          flyctl scale count 1 -a clynotion -y || true

      - name: Deploy
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Confirm Roles markup and the owner account
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -D /tmp/headers.txt -o /tmp/index.html https://clynotion.com/
          python3 - << 'PY'
          headers = open("/tmp/headers.txt").read().lower()
          html = open("/tmp/index.html").read()
          assert "no-store" in headers, headers
          assert 'id="btn-top-roles"' in html
          assert "Roles &amp; access" in html
          assert "Two-minute week" not in html
          assert "Start with supervision notes" not in html
          print("HTML roles button present and not cached")
          PY
          flyctl ssh console -a clynotion -C "/app/.venv/bin/python -c \"from app.access.resolve import is_owner, permissions_for; from app.auth import User; u=User('google:ops','Evan Queitsch','practice-hfc','operations@heart4change.org'); print('OWNER', is_owner(u)); print('MANAGE', 'capability:manage_roles' in permissions_for(u))\""
