name: Read-only volume inventory

on:
  workflow_dispatch:

jobs:
  inventory:
    name: Count persisted stores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Read-only inventory
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          b64="$(base64 -w0 scripts/inventory_readonly.py)"
          flyctl ssh console -a clynotion -C "/app/.venv/bin/python -c \"import os,sys,base64; os.chdir('/app'); sys.path.insert(0,'/app'); exec(base64.b64decode('${b64}'))\""
