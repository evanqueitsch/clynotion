name: Fly log check

on:
  workflow_dispatch:

jobs:
  logs:
    name: Redacted recent logs
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Recent redacted app logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          # Drop query values that can carry OAuth codes. Keep only our short result flags.
          flyctl logs -a clynotion --no-tail 2>&1 \
            | sed -E \
              -e 's/([?&](code|state|access_token|refresh_token|id_token|token)=)[^&" ]+/\1REDACTED/g' \
            | awk '
              /gmail_send|gmail-send|google_token|google_oauth|directory_error|workspace_tokens|GmailSend|token_exchange/ {
                print
              }
            ' \
            | tail -n 200
